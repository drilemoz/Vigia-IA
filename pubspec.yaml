name: vigiaia
description: Vigia IA para monitoramento local com camera, RTSP e deteccao de objetos offline.
publish_to: "none"
version: 1.0.306+306
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  crypto: ^3.0.6
  flutter_tts: ^4.2.5
  image: ^4.10.1
  flutter_litert: 3.8.0
  path_provider: ^2.1.6
  vlc_player: ^2.1.2
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  flutter_map: ^8.3.2
  google_maps_flutter: ^2.18.1
  maplibre: ^0.3.6
  flutter_map_mbtiles: ^1.0.4
  geolocator: ^14.0.3
  latlong2: ^0.9.1
  sqlite3: ^2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/yolo26s.tflite
    - assets/models/efficientdet_lite2.tflite
    - assets/models/yolo_coco80.txt
    - assets/models/efficientdet_lite0.tflite
    - assets/models/ssd_mobilenet_v1.tflite
    - assets/models/labelmap.txt
    - assets/images/modes/
