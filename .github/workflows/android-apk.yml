name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# Pushes sucessivos da mesma branch não desperdiçam minutos de runner.
# Builds manuais não cancelam releases enviados explicitamente pelo usuário.
concurrency:
  group: vigiaia-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
          cache-cleanup: never

      - name: Ler versão do aplicativo
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          VERSION_NAME="${VERSION%%+*}"
          BUILD_NUMBER="${VERSION##*+}"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "full_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache dos modelos de IA
        uses: actions/cache@v4
        with:
          path: assets/models/*.tflite
          key: vigiaia-models-v3-yolo26s-litert

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f android/app/build.gradle.kts && -f android/settings.gradle.kts && -f android/gradle/wrapper/gradle-wrapper.properties && -f android/app/src/main/res/values/styles.xml && -f android/app/src/main/res/mipmap/ic_launcher.xml ]]; then
            echo "Projeto Android versionado encontrado; bootstrap completo dispensado."
          else
            echo "Projeto Android incompleto; executando bootstrap de recuperacao."
            bash ./tool/bootstrap_android.sh
          fi

      - name: Dependencias
        run: flutter pub get

      - name: Verificacao preventiva
        run: bash ./tool/verify_project.sh

      - name: Analise estatica
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Baixar modelo TensorFlow Lite
        run: bash ./tool/fetch_model.sh

      - name: Preparar YOLO26s offline (obrigatório na release)
        shell: bash
        run: |
          set -euo pipefail
          timeout 900 bash ./tool/export_yolo26s.sh
          # Validar o arquivo real, jamais aceitar o stub presente no fonte.
          python3 tool/export_yolo26s.py
          test "$(wc -c < assets/models/yolo26s.tflite)" -ge 3000000
          sha256sum assets/models/yolo26s.tflite
          echo "YOLO26s LiteRT validado. A release terá o modelo principal."

      - name: Testes
        # CI 204: um único testWidgets aguardou o timeout padrão de 10 minutos.
        # Mantém cobertura e libera o erro em até 2 minutos por teste.
        timeout-minutes: 7
        run: flutter test --reporter expanded --coverage --timeout 120s

      - name: Salvar cobertura de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-test-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Preparar assinatura release
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 ausente" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Secret ANDROID_KEYSTORE_PASSWORD ausente" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Secret ANDROID_KEY_ALIAS ausente" >&2; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/vigiaia-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "Keystore reconstruida esta vazia" >&2; exit 1; }
          keytool -list             -keystore "$KEYSTORE_PATH"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build APKs release em uma unica compilacao
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.meta.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          VIGIAIA_CI_MULTI_APK: '1'
          # Opcional: o Gradle coloca esta chave no AndroidManifest do APK.
          # Nunca imprimir o valor nem comitar a chave no repositório.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PATH" || { echo "ANDROID_KEYSTORE_PATH ausente" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Secret ANDROID_KEYSTORE_PASSWORD ausente" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Secret ANDROID_KEY_ALIAS ausente" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Secret ANDROID_KEY_PASSWORD ausente" >&2; exit 1; }
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME ausente" >&2; exit 1; }
          test -n "${FLUTTER_ROOT:-}" || { echo "FLUTTER_ROOT ausente" >&2; exit 1; }

          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          flutter.sdk=$FLUTTER_ROOT
          flutter.buildMode=release
          flutter.versionName=$APP_VERSION_NAME
          flutter.versionCode=$APP_BUILD_NUMBER
          EOF

          echo "Gerando universal + armeabi-v7a + arm64-v8a + x86_64 em uma unica chamada assembleRelease..."
          (cd android && gradle :app:assembleRelease --build-cache --parallel)

      - name: Nomear APKs e analisar tamanho
        shell: bash
        env:
          APP_VERSION: ${{ steps.meta.outputs.full_version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ROOT_DIR="$PWD"
          RELEASE_DIR="build/release"
          mkdir -p "$RELEASE_DIR"
          python3 - "$APP_VERSION" "$RELEASE_DIR" <<'PY'
          import json
          from pathlib import Path
          import shutil
          import sys

          version = sys.argv[1]
          version_name, separator, version_number = version.partition('+')
          if not separator or not version_name or not version_number.isdigit():
              raise SystemExit(f'Versao de release invalida: {version}')
          version_code = int(version_number)
          release_dir = Path(sys.argv[2])
          apk_dir = Path('build/app/outputs/apk/release')
          metadata = apk_dir / 'output-metadata.json'
          if not metadata.is_file():
              raise SystemExit(f'Metadata de APKs nao encontrada: {metadata}')

          data = json.loads(metadata.read_text(encoding='utf-8'))
          if data.get('applicationId') != 'com.vigiaia.app':
              raise SystemExit('applicationId inesperado no metadata dos APKs')
          found = set()
          expected = {'universal', 'armeabi-v7a', 'arm64-v8a', 'x86_64'}
          for element in data.get('elements', []):
              filters = {item.get('filterType'): item.get('value') for item in element.get('filters', [])}
              abi = filters.get('ABI')
              kind = abi or 'universal'
              if kind not in expected:
                  continue
              if element.get('versionName') != version_name or element.get('versionCode') != version_code:
                  raise SystemExit(f'APK {kind} diverge da versao solicitada: {element.get("versionName")}+{element.get("versionCode")}')
              source = apk_dir / element['outputFile']
              if not source.is_file() or source.stat().st_size == 0:
                  raise SystemExit(f'APK ausente/vazia para {kind}: {source}')
              target = release_dir / f'VigiaIA-v{version}-{kind}.apk'
              shutil.copy2(source, target)
              found.add(kind)
              print(f'{kind}: {source} -> {target}')

          missing = sorted(expected - found)
          if missing:
              raise SystemExit('APKs esperadas nao geradas em uma unica compilacao: ' + ', '.join(missing))
          # Impede publicar APK que tenha apenas o arquivo de 24 bytes do fonte.
          from zipfile import ZipFile
          import hashlib
          expected_sha = hashlib.sha256(Path('assets/models/yolo26s.tflite').read_bytes()).hexdigest()
          for apk in sorted(release_dir.glob('*.apk')):
              with ZipFile(apk) as zip_file:
                  matches = [item for item in zip_file.infolist()
                             if item.filename.endswith('/assets/models/yolo26s.tflite')]
                  if len(matches) != 1 or matches[0].file_size < 3_000_000:
                      raise SystemExit(f'APK sem YOLO26s real: {apk.name}')
                  with zip_file.open(matches[0]) as stream:
                      actual_sha = hashlib.file_digest(stream, 'sha256').hexdigest()
                  if actual_sha != expected_sha:
                      raise SystemExit(f'YOLO26s embutido diverge do validado: {apk.name}')
                  print(f'YOLO26s no APK {apk.name}: {matches[0].file_size} bytes, SHA-256 OK')
          PY
          python3 - "$RELEASE_DIR" "$RELEASE_DIR/apk-size-report.txt" <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import sys, zipfile

          release_dir = Path(sys.argv[1])
          report = Path(sys.argv[2])
          lines = []
          for apk in sorted(release_dir.glob('*.apk')):
              groups = defaultdict(int)
              largest = []
              with zipfile.ZipFile(apk) as archive:
                  for item in archive.infolist():
                      top = item.filename.split('/', 1)[0]
                      groups[top] += item.compress_size
                      largest.append((item.compress_size, item.file_size, item.filename))
              lines.extend([
                  f'APK: {apk.name}',
                  f'Tamanho final: {apk.stat().st_size} bytes',
                  '',
                  'Tamanho comprimido por diretório:',
              ])
              for name, size in sorted(groups.items(), key=lambda pair: pair[1], reverse=True):
                  lines.append(f'{size:>12}  {name}')
              lines.extend(['', '30 maiores arquivos internos (comprimido / original):'])
              for compressed, original, name in sorted(largest, reverse=True)[:30]:
                  lines.append(f'{compressed:>12} / {original:>12}  {name}')
              lines.extend(['', '=' * 72, ''])
          report.write_text('\n'.join(lines) + '\n')
          PY
          flutter pub deps --style=compact > "$RELEASE_DIR/flutter-dependencies.txt"
          (cd android && gradle :app:dependencies --configuration releaseRuntimeClasspath) > "$ROOT_DIR/$RELEASE_DIR/gradle-release-dependencies.txt"
          cat "$RELEASE_DIR/apk-size-report.txt"

      - name: Verificar assinatura dos APKs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner" || { echo "apksigner nao encontrado" >&2; exit 1; }
          for apk in build/release/*.apk; do
            test -s "$apk" || { echo "APK release nao encontrada" >&2; exit 1; }
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Publicar APKs na Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.meta.outputs.full_version }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/release/*.apk --clobber
          else
            gh release create "$TAG" build/release/*.apk \
              --title "Vigia IA v${APP_VERSION}" \
              --generate-notes
          fi

      - name: Arquivar relatórios técnicos
        uses: actions/upload-artifact@v4
        with:
          name: VigiaIA-v${{ steps.meta.outputs.full_version }}-relatorios
          path: |
            build/release/apk-size-report.txt
            build/release/flutter-dependencies.txt
            build/release/gradle-release-dependencies.txt
          compression-level: 0
          if-no-files-found: error
